services:
  postgres:
    profiles: [dev]
    image: &postgres_image postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: telebotshop_dev
      POSTGRES_USER: telebotshop_dev
      POSTGRES_PASSWORD: dev-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, telebotshop_dev, -d, telebotshop_dev]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    profiles: [test]
    image: *postgres_image
    environment:
      POSTGRES_DB: telebotshop_test
      POSTGRES_USER: telebotshop_test
      POSTGRES_PASSWORD: test-local-only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - type: bind
        source: ./docker/postgres-test-init.sql
        target: /docker-entrypoint-initdb.d/01-test-marker.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, pg_isready, -U, telebotshop_test, -d, telebotshop_test]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-dev:
