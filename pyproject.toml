[project]
name = "telebotshop"
version = "0.1.0"
description = "Telegram digital goods shop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.156.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.0.55",
    "uvicorn==0.54.0",
]

[project.scripts]
telebotshop = "telebotshop.bootstrap:main"

[build-system]
requires = ["uv_build==0.13.4"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.15.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.uv]
required-version = "==0.13.4"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/architecture"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
